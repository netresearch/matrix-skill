#
# SonarCloud automatic analysis settings.
#
# The two skills share one config file but install independently, so each
# carries its own config loader and tests. Commit 84c92dd added the same
# token resolution (resolve_tokens) to both copies on purpose, with tests in
# each. Exclude the copies from copy-paste detection so the intended
# duplication does not fail the quality gate. The request helpers
# (_lib/http.py, _lib/admin_http.py) carry the same redirect handler and
# redirect tests for the same reason.
sonar.cpd.exclusions=skills/matrix-administration/scripts/_lib/config.py,skills/matrix-communication/scripts/_lib/config.py,skills/matrix-administration/scripts/_lib/test_config.py,skills/matrix-communication/scripts/_lib/test_config.py,skills/matrix-communication/scripts/_lib/http.py,skills/matrix-administration/scripts/_lib/admin_http.py,skills/matrix-communication/scripts/_lib/test_http.py,skills/matrix-administration/scripts/_lib/test_admin_http.py
