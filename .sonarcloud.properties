#
# SonarCloud automatic analysis settings.
#
# The two skills install independently, so each carries its own request
# helper. The helpers (_lib/http.py, _lib/admin_http.py) carry the same
# redirect handler and redirect tests on purpose. Exclude the copies from
# copy-paste detection so the intended duplication does not fail the
# quality gate.
sonar.cpd.exclusions=skills/matrix-communication/scripts/_lib/http.py,skills/matrix-administration/scripts/_lib/admin_http.py,skills/matrix-communication/scripts/_lib/test_http.py,skills/matrix-administration/scripts/_lib/test_admin_http.py
